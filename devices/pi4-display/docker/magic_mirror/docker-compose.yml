services:
  magicmirror: # https://github.com/MagicMirrorOrg/MagicMirror
    container_name: magicmirror
    image: karsten13/magicmirror:latest
    # 웹 리모컨의 Restart는 Electron을 끝내므로 Docker가 다시 띄워야 함 (부팅 시 자동 시작도 됨)
    restart: unless-stopped
    privileged: true
    network_mode: "host"
    # ports:
    #   - "8080:8080"
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
      - /run/user/1000/wayland-0:/run/user/1000/wayland-0:ro
      - /run/user/1000/bus:/run/user/1000/bus:ro
      - /usr/share/fonts:/usr/share/fonts:ro
      - /dev/dri:/dev/dri

      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      - /run/systemd/system:/run/systemd/system
      - /bin/systemctl:/bin/systemctl
      # 웹 리모컨의 모니터 켜기/끄기 기본 명령 (wlopm --on/--off)
      - /usr/bin/wlopm:/usr/local/bin/wlopm:ro

      - ./data/config:/opt/magic_mirror/config
      - ./data/modules:/opt/magic_mirror/modules
      - ./data/css:/opt/magic_mirror/css
    environment:
      - TZ=Asia/Seoul
      - DISPLAY=:0
      - WAYLAND_DISPLAY=wayland-0
      - XDG_SESSION_TYPE=wayland
      - XDG_RUNTIME_DIR=/run/user/1000
      - ELECTRON_ENABLE_GPU=true
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
      - MM_LAT=${MM_LAT:?set in .env}
      - MM_LON=${MM_LON:?set in .env}

  mmpm:  # https://github.com/bee-mar/mmpm
    container_name: mmpm
    image: karsten13/mmpm:latest
    # magicmirror와 같이 부팅 시 자동 시작
    restart: unless-stopped
    # 브라우저(웹 UI)가 직접 접속하는 포트
    ports:
      - "7890:7890"  # 웹 UI
      - "6789:6789"  # 로그 뷰어 (Socket.IO)
      - "8907:8907"  # MM 상태 표시와 모듈 표시/숨김 (Socket.IO 중계)
    # magicmirror는 host 네트워크를 쓰므로 컨테이너 이름으로 찾을 수 없어, 호스트 게이트웨이 주소로 연결함
    extra_hosts:
      - "magicmirror:host-gateway"
    # MMPM은 자기 설정 파일(~/.config/mmpm/mmpm-env.json)만 읽음
    # 이미지의 entrypoint가 MMPM_MAGICMIRROR_URI만 환경 변수에서 그 파일로 옮겨 줌
    environment:
      - TZ=Asia/Seoul
      - MMPM_MAGICMIRROR_URI=http://magicmirror:8080
    volumes:
      - ./data/config:/home/node/MagicMirror/config
      - ./data/modules:/home/node/MagicMirror/modules
    depends_on:
      - magicmirror
