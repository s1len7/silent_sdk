services:
  faster-whisper:
    image: lscr.io/linuxserver/faster-whisper:latest
    container_name: faster-whisper
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # - DEBUG= #optional
      # - LOCAL_ONLY= #optional
      # - WHISPER_BEAM=1 #optional
      # - WHISPER_LANG=auto #optional
      # - WHISPER_MODEL=auto #optional
    volumes:
      - ./data/config:/config
    ports:
      - 10300:10300
    restart: unless-stopped
