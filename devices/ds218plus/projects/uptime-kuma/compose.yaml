# Uptime Kuma: 서비스 감시
# 웹 화면: http://<NAS>:3001
services:
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./app/data:/app/data
    extra_hosts:
      # 감시 대상에서 쓰는 NAS 이름, 컨테이너 안에서는 .local 이름이 풀리지 않으므로 Docker가 호스트(NAS) 주소로 바꿔 주는 host-gateway로 연결
      - "silent_nas.local:host-gateway"
