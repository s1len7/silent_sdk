services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped

    ports:
      - "8080:80"
      - "8181:81"
      - "4443:443"

    volumes:
      - ./data:/data
      - ./etc/letsencrypt:/etc/letsencrypt

    environment:
      TZ: Asia/Seoul
