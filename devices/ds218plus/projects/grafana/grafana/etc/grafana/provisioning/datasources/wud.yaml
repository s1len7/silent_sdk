# WUD API를 Grafana 데이터 소스로 등록 (Infinity 플러그인): 컨테이너 이름, 상태, 새 버전 여부
# WUD_URL, WUD_PASSWORD는 grafana 프로젝트의 .env에서 읽음
apiVersion: 1
datasources:
  - name: WUD
    uid: wud-infinity
    type: yesoreyeram-infinity-datasource
    url: ${WUD_URL}
    basicAuth: true
    basicAuthUser: admin
    jsonData:
      auth_method: basicAuth
      allowedHosts:
        - ${WUD_URL}
    secureJsonData:
      basicAuthPassword: ${WUD_PASSWORD}
