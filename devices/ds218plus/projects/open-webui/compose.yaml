# Open WebUI: LLM 웹 UI
# 미사용 (멈춤, 자동 시작 안 함), 함께 쓰던 ollama도 미사용
# 웹 화면: http://<NAS>:38080
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    network_mode: bridge
    ports:
      - "38080:8080/tcp"
    volumes:
      - ./app/backend/data:/app/backend/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Seoul
      # 최초 관리자 가입 후 false로 변경 추천
      - ENABLE_SIGNUP=true
      # 로컬 Ollama 연동
      - OLLAMA_BASE_URL=http://docker.internal
      # 웹 검색 (별도 서버 없이 동작하는 duckduckgo)
      - ENABLE_RAG_WEB_SEARCH=true
      - RAG_WEB_SEARCH_ENGINE=duckduckgo
      # 문서 임베딩은 Ollama가 처리 (NAS RAM 절약)
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=all-minilm:latest
    extra_hosts:
      # 컨테이너 안에서 NAS 호스트에 접속
      - "host.docker.internal:host-gateway"
    # restart: unless-stopped
