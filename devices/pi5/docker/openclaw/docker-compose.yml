# OpenClaw Gateway (클라우드 모델용, slim 이미지, 메모리 상한 2GB)
# 공식 compose(github.com/openclaw/openclaw docker-compose.yml)의 gateway 서비스를 줄여서 씀
# 설치·온보딩은 scripts/setup_openclaw.sh
services:
  openclaw:
    container_name: openclaw
    image: ghcr.io/openclaw/openclaw:slim
    restart: unless-stopped
    # 대기 중 약 0.9GB, 답 생성 중 1.5GB 넘어 1.5GB 상한에서 OOM 종료됨(2026-11-02). 커널 memory cgroup이 켜져 있어야 적용됨 (setup_memory_cgroup.sh)
    mem_limit: 2g
    environment:
      HOME: /home/node
      TZ: Asia/Seoul
    volumes:
      # 설정(openclaw.json)·인증·작업 폴더 (compose 파일 옆 data/, 컨테이너 사용자 node = uid 1000)
      - ./data:/home/node/.openclaw
    ports:
      - 18789:18789
    # 공식 compose와 같은 보안 옵션
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    # 랜에 공개 (접속은 token 인증)
    command: ["node", "openclaw.mjs", "gateway", "--bind", "lan", "--port", "18789"]
